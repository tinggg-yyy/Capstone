<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover"
    />
    <link rel="manifest" href="../manifest.json" />
    <title>PET · Social App</title>

    <!-- NES -->
    <!-- <link rel="stylesheet" href="../node_modules/nes.css/css/nes.css" /> -->
    <!-- minify -->
    <link
      href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css"
      rel="stylesheet"
    />
    <!-- latest -->
    <!-- <link href="https://unpkg.com/nes.css@latest/css/nes.min.css" rel="stylesheet" /> -->
    <!-- core style only -->
    <!-- <link href="https://unpkg.com/nes.css/css/nes-core.min.css" rel="stylesheet" /> -->

    <link rel="stylesheet" href="style.css" />

    <script src="../lib/p5.js"></script>
    <script src="../lib/p5.sound.js"></script>
  </head>
  <body>
    <!-- Launch Page -->
    <section id="launch" class="page active">
      <div class="phone">
        <h1 class="logo">PET</h1>
        <p class="subtitle">为您的宠物寻找朋友 / Find friends for your pet</p>
        <button class="nes-btn" onclick="goTo('login')">开始 / START</button>
        <!-- <button class="nes-btn" onclick="createSwipeCard()">
          直接划 / SWIPE
        </button> -->
      </div>
    </section>

    <!-- Login / Sign up -->
    <section id="login" class="page">
      <div class="phone">
        <h2>注册 / 登录 / Sign Up / Login</h2>
        <div class="nes-field">
          <label for="name_field">用户名 / Username</label>
          <input
            id="username"
            class="nes-input"
            type="text"
            placeholder="用户名 / Username"
          />
          <label for="name_field">密码 / Password</label>
          <input
            id="password"
            class="nes-input"
            type="password"
            placeholder="密码 / Password"
          />
        </div>
        <button class="nes-btn" onclick="handleLogin()">进入 / Enter</button>
      </div>
    </section>

    <!-- Pet Profile - Name -->
    <section id="profile-name" class="page">
      <div class="phone">
        <div class="nes-field">
          <label for="name_field">名字 / Name</label>
          <input
            id="petName"
            class="nes-input"
            type="text"
            placeholder="你的宠物叫什么？ / What is your pet's name?"
          />
        </div>

        <button class="nes-btn" onclick="goTo('profile-breed')">
          下一步 / Next
        </button>
        <button class="nes-btn" onclick="goTo('login')">
          上一步 / Previous
        </button>
      </div>
    </section>

    <!-- Pet Profile - Breed -->
    <section id="profile-breed" class="page">
      <div class="phone">
        <label for="petBreed">宠物品种 / Pet Breed</label>
        <div class="nes-select">
          <select id="petBreed">
            <option value="" disabled selected hidden>Select...</option>
            <option value="狗 / DOG">狗 / DOG</option>
            <option value="猫 / CAT">猫 / CAT</option>
            <option value="兔子 / RABBIT">兔子 / RABBIT</option>
            <option value="鸟类 / BIRD">鸟类 / BIRD</option>
            <option value="爬行动物 / REPTILE">爬行动物 / REPTILE</option>
            <option value="节肢动物 / Arthropod">节肢动物 / Arthropod</option>
            <option value="其他 / Other ">其他 / Other</option>
          </select>
        </div>
        <button class="nes-btn" onclick="goTo('profile-gender')">
          下一步 / Next
        </button>
        <button class="nes-btn" onclick="goTo('profile-name')">
          上一步 / Previous
        </button>
      </div>
    </section>

    <!-- Pet Profile - Gender -->
    <section id="profile-gender" class="page">
      <div class="phone">
        <label>性别 / GENDER </label>
        <div class="nes-select">
          <select id="petGender">
            <option value="公/Male">公 / Male</option>
            <option value="母/Female">母 / Female</option>
            <option value="未知/Unknown">未知 / Unknown</option>
          </select>
        </div>

        <div class="nes-field">
          <label>出生日期 / BIRTH DATE</label>
          <input
            id="birthDisplay"
            class="nes-input"
            type="text"
            placeholder="YYYY-MM-DD"
            readonly
            onclick="openDatePicker()"
          />

          <div id="datePicker" class="date-picker hidden">
            <div class="wheel" id="yearWheel"></div>
            <div class="wheel" id="monthWheel"></div>
            <div class="wheel" id="dayWheel"></div>
            <button class="nes-btn is-primary" onclick="confirmDate()">
              确定
            </button>
          </div>

          <div class="nes-field">
            <label for="name_field">户籍/Hukou</label>
            <input
              id="petHukou"
              class="nes-input"
              type="text"
              placeholder="你的宠物户籍是？ / What is your pet's hukou?"
            />
          </div>
        </div>

        <button class="nes-btn" onclick="goTo('profile-sterilized')">
          下一步 / Next
        </button>
        <button class="nes-btn" onclick="goTo('profile-breed')">
          上一步 / Previous
        </button>
      </div>
    </section>

    <!-- Pet Profile - Sterilized -->
    <section id="profile-sterilized" class="page">
      <div class="phone">
        <label>是否绝育 / Sterilized or not</label>
        <div class="nes-select">
          <select id="petSterilized">
            <option value="是/Yes">是 / Yes</option>
            <option value="否/No">否 / No</option>
          </select>
        </div>

        <button class="nes-btn" onclick="goTo('profile-mbti')">
          下一步 / Next
        </button>
        <button class="nes-btn" onclick="goTo('profile-gender')">
          上一步 / Previous
        </button>
      </div>
    </section>

    <!-- Pet Profile - MBTI -->
    <section id="profile-mbti" class="page">
      <div class="phone">
        <label for="petMbti">MBTI类型 / MBTI Type</label>

        <div class="nes-select">
          <select id="petMbti1">
            <option value="" disabled selected hidden>E/I</option>
            <option value="E">E</option>
            <option value="I">I</option>
          </select>
        </div>
        <p>E (外向Extraversion) / I (内向Introversion)</p>

        <div class="nes-select">
          <select id="petMbti2">
            <option value="" disabled selected hidden>S/N</option>
            <option value="S">S</option>
            <option value="N">N</option>
          </select>
        </div>
        <p>S (感觉Sensing) / N (直觉Intuition)</p>

        <div class="nes-select">
          <select id="petMbti3">
            <option value="" disabled selected hidden>T/F</option>
            <option value="T">T</option>
            <option value="F">F</option>
          </select>
        </div>
        <p>T (思考Thinking) / F (情感Feeling)</p>

        <div class="nes-select">
          <select id="petMbti4">
            <option value="" disabled selected hidden>J/P</option>
            <option value="J">J</option>
            <option value="P">P</option>
          </select>
        </div>
        <p>J (判断Judging) / P (知觉Perceiving)</p>

        <button class="nes-btn" onclick="goTo('profile-daily-life')">
          下一步 / Next
        </button>
        <button class="nes-btn" onclick="goTo('profile-sterilized')">
          上一步 / Previous
        </button>
      </div>
    </section>

    <!-- Pet Profile - Daily Life -->
    <section id="profile-daily-life" class="page">
      <div class="phone">
        <label for="dailylife">日常生活 / Daily Life</label>
        <textarea
          id="dailylife"
          class="nes-textarea"
          placeholder="一天几顿饭？多久洗一次澡？ / How many meals a day? How often to bathe?"
        ></textarea>

        <!-- <label for="achievement">
          ${name}干过最厉害的事 / ${name}'s Most Impressive Achievement</label
        >
        <textarea
          id="achievement"
          class="nes-textarea"
          placeholder="比如：咬过最大的敌人 / For example: The biggest enemy it has bitten"
        ></textarea> -->

        <button class="nes-btn" onclick="goTo('profile-hobbies')">
          下一步 / Next
        </button>
        <button class="nes-btn" onclick="goTo('profile-mbti')">
          上一步 / Previous
        </button>
      </div>
    </section>

    <!-- Pet Profile - Hobbies -->
    <section id="profile-hobbies" class="page">
      <div class="phone">
        <label for="hobby">兴趣爱好 / Hobbies</label>
        <textarea
          id="hobby"
          class="nes-textarea"
          placeholder="遛弯 / 社交 / 睡觉 / 咬人 / Walking / Socializing / Sleeping / Biting"
        ></textarea>
        <button class="nes-btn" onclick="goTo('profile-photo')">
          下一步 / Next
        </button>
        <button class="nes-btn" onclick="goTo('profile-daily-life')">
          上一步 / Previous
        </button>
      </div>
    </section>

    <!-- Profile Photo -->
    <section id="profile-photo" class="page">
      <div class="phone">
        <h1>创造你的宠物照片 / Create Your Pet Photo</h1>
        <div class="main-wrapper">
          <h1>你的宠物 Your Pet</h1>
          <!-- the following div will contain the p5 canvas. -->
          <section class="pixeldraw">
            <div id="p5-canvas-container">
              <!-- p5 canvas will be appended here. -->
            </div>
            <div id="tools">
              <button class="nes-btn" onclick="setBrush()">画笔/BRUSH</button>
              <button class="nes-btn is-error" onclick="setEraser()">
                橡皮擦/ERASER
              </button>
              <button class="nes-btn is-success" onclick="setClear()">
                清空/CLEAR
              </button>
              <div id="text-tools">
                <input
                  id="text-input"
                  class="nes-input"
                  type="text"
                  placeholder="输入文字 / Enter text"
                />
                <button class="nes-btn" onclick="drawText()">
                  绘制文字 / Draw Text
                </button>
              </div>
            </div>
          </section>
          <!-- <p>Project Description</p> -->
        </div>
        <button class="nes-btn" onclick="createCard()">
          生成档案卡 / Generate Profile
        </button>
        <button class="nes-btn" onclick="goTo('profile-hobbies')">
          上一步 / Previous
        </button>
      </div>
    </section>

    <!-- Profile Card -->
    <section id="card" class="page">
      <div class="phone">
        <div id="petCard" class="card"></div>
        <button class="nes-btn" onclick="createSwipeCard()">
          Start Swiping!
        </button>
      </div>
    </section>

    <!-- Other's Profile -->
    <section id="swipe-page" class="page">
      <div class="phone">
        <div class="scroll">
          <div id="swipe-container"></div>
        </div>
      </div>

      <div class="swipebutton">
        <button class="nes-btn" onclick="like()">💗</button>
        <div id="text-tools">
          <input
            id="impression"
            class="nes-input"
            type="text"
            placeholder="你的印象 / Your Impression"
          />
          <button class="nes-btn" id="impression-btn" onclick="impression()">
            评论 / Comment
          </button>
        </div>
        <button class="nes-btn" onclick="skip()">❌</button>
      </div>
    </section>

    <script src="sketch.js"></script>
    <script src="script.js"></script>
  </body>
</html>
